<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUBDUM - Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h1>QUBDUM</h1>
            <p>Pong Game</p>
        </div>
        
        <div class="scoreboard">
            <div class="score-section">
                <h2>Player</h2>
                <div class="score" id="playerScore">0</div>
            </div>
            <div class="score-section">
                <h2>Computer</h2>
                <div class="score" id="computerScore">0</div>
            </div>
        </div>

        <div class="game-info">
            <p id="gameStatus">Press SPACE to Start</p>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="controls">
            <h3>Controls</h3>
            <ul>
                <li><strong>Mouse:</strong> Move left paddle up/down</li>
                <li><strong>↑ / ↓ Keys:</strong> Move left paddle up/down</li>
                <li><strong>SPACE:</strong> Start/Pause Game</li>
                <li><strong>R:</strong> Reset Game</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
