<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="QUBDUM - A modern Pong game with AI opponent. Play on any device!">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QUBDUM">
    <title>QUBDUM - Pong Game</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23667eea' width='192' height='192'/><text x='96' y='120' font-size='80' font-weight='bold' fill='%2300ff88' text-anchor='middle' font-family='Arial'>Q</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23667eea' width='192' height='192'/><text x='96' y='120' font-size='80' font-weight='bold' fill='%2300ff88' text-anchor='middle' font-family='Arial'>Q</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="game-header">
            <h1>QUBDUM</h1>
            <p>Pong Game - PWA Version</p>
        </div>
        
        <div class="scoreboard">
            <div class="score-section">
                <h2>Player</h2>
                <div class="score" id="playerScore">0</div>
            </div>
            <div class="score-section">
                <h2>Computer</h2>
                <div class="score" id="computerScore">0</div>
            </div>
        </div>

        <div class="game-info">
            <p id="gameStatus">Press SPACE to Start</p>
            <p id="onlineStatus" style="font-size: 12px; color: #00ccff; margin-top: 5px;"></p>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="controls">
            <h3>Controls</h3>
            <ul>
                <li><strong>Mouse/Touch:</strong> Move left paddle up/down</li>
                <li><strong>↑ / ↓ Keys:</strong> Move left paddle up/down</li>
                <li><strong>SPACE:</strong> Start/Pause Game</li>
                <li><strong>R:</strong> Reset Game</li>
            </ul>
        </div>

        <div class="pwa-info" id="pwaPrompt" style="display: none;">
            <p>💾 Install QUBDUM on your device for offline play!</p>
            <button onclick="installPWA()" style="background: #00ff88; color: #000; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;">Install App</button>
            <button onclick="closePWAPrompt()" style="background: transparent; color: #00ff88; border: 2px solid #00ff88; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-left: 10px;">Later</button>
        </div>
    </div>

    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js')
                .then((reg) => {
                    console.log('Service Worker registered successfully:', reg);
                    updateOnlineStatus();
                })
                .catch((error) => {
                    console.log('Service Worker registration failed:', error);
                });
        }

        // Update online status
        function updateOnlineStatus() {
            const statusEl = document.getElementById('onlineStatus');
            if (navigator.onLine) {
                statusEl.textContent = '✓ Online';
                statusEl.style.color = '#00ff88';
            } else {
                statusEl.textContent = '📡 Offline (Cached)';
                statusEl.style.color = '#ffff00';
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // PWA Install Prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwaPrompt').style.display = 'block';
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    } else {
                        console.log('User dismissed the install prompt');
                    }
                    deferredPrompt = null;
                    document.getElementById('pwaPrompt').style.display = 'none';
                });
            }
        }

        function closePWAPrompt() {
            document.getElementById('pwaPrompt').style.display = 'none';
        }

        // Handle app installed event
        window.addEventListener('appinstalled', () => {
            console.log('QUBDUM PWA was installed');
            deferredPrompt = null;
            document.getElementById('pwaPrompt').style.display = 'none';
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
